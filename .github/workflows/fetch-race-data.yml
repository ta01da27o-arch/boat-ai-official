name: Fetch Boat Race Data

on:
  workflow_dispatch: # 手動実行

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    steps:
      # 1. リポジトリをチェックアウト
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js をセットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. 依存関係インストール
      - name: Install dependencies
        run: npm install

      # 4. 出走表URL一覧を取得
      - name: Fetch today's links
        run: npm run fetch-links

      # 5. 各場の出走表詳細を取得
      - name: Fetch race details
        run: npm run fetch-details

      # 6. 取得した JSON をアーティファクトとしてアップロード
      - name: Upload data.json
        uses: actions/upload-artifact@v4
        with:
          name: race-data
          path: data/data.json

      - name: Upload today_links.json
        uses: actions/upload-artifact@v4
        with:
          name: today-links
          path: data/today_links.json