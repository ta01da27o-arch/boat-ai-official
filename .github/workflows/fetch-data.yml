name: Fetch Boatrace Data

on:
  workflow_dispatch:  # ← 手動実行ボタンで動作

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      # ① リポジトリをチェックアウト
      - name: Checkout
        uses: actions/checkout@v4

      # ② Node.js のセットアップ
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ③ 依存ライブラリをインストール
      - name: Install dependencies
        run: npm install

      # ④ Playwright のブラウザ依存をインストール（ここ重要！）
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # ⑤ レースデータ取得を実行
      - name: Run fetch-all
        run: npm run fetch-all

      # ⑥ 取得したデータを成果物としてアップロード
      - name: Upload data
        uses: actions/upload-artifact@v4
        with:
          name: boatrace-data
          path: server/data/