name: Fetch Boatrace Data

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Fetch racecards
        run: npm run fetch-all

      - name: Commit data
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"
          git add server/data/racecards.json
          git commit -m "Update racecards.json [auto]" || echo "No changes"
          git push