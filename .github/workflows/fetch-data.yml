name: Fetch Boat Race Data

on:
  schedule:
    - cron: "5 5 * * *"   # JST 14:05
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v3

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Fetch all
        run: node server/fetch_all.js

      - name: Verify
        run: node server/verifyData.js

      - name: Commit & Push
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m "auto update race data" || echo "No changes"
          git push