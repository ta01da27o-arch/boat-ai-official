name: Fetch Boat Race Data

on:
  workflow_dispatch:  # 手動実行可能

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Fetch Racecards & Verify
        run: npm run fetch-all