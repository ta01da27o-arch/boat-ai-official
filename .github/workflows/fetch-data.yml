name: Fetch Boatrace Data

on:
  schedule:
    - cron: "0 2 * * *"   # 日本時間11時 (UTC 02:00)
  workflow_dispatch:

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run fetch-all
        run: npm run fetch-all

      - name: Commit & Push changes
        run: |
          git config --local user.name "github-actions"
          git config --local user.email "actions@github.com"
          git add server/data/racecards.json || exit 0
          git commit -m "Auto-update racecards" || echo "No changes to commit"
          git push