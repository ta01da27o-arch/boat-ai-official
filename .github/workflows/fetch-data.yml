name: Fetch Boatrace Racecards

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 リポジトリを取得
        uses: actions/checkout@v4

      - name: 🧰 Nodeをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📦 依存関係をインストール
        run: npm install

      - name: 🏁 出走表を取得
        run: npm run fetch-all

      - name: 💾 結果を保存（コミット）
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add server/data/racecards.json
          git commit -m "Update racecards.json ($(date '+%Y-%m-%d %H:%M:%S'))" || echo "No changes"
          git push