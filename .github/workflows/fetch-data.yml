name: Fetch Race Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * *"   # 日本時間 07:00

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 20

      - run: npm install

      - run: npm run fetch-all

      - name: Commit & Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add server/data/*.json
          git commit -m "update data" || echo "No changes"
          git push