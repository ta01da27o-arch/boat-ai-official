name: Fetch All Boatrace Data

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Fetch all race data
        run: npm run fetch-all

      - name: Upload data artifacts
        uses: actions/upload-artifact@v4
        with:
          name: race-data
          path: server/data/
